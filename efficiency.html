<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Device Efficiency Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Inline styles for specific efficiency test elements not yet in style.css */
        .test-area {
            position: relative;
            width: 100%;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .target-circle {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .target-circle:active {
            transform: scale(0.9);
        }

        .typing-display {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            text-align: left;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .typing-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            font-family: monospace;
            resize: none;
        }

        .touch-target {
            width: 80px;
            height: 80px;
            border-radius: 12px;
        }

        .swipe-instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            opacity: 0.5;
            pointer-events: none;
        }

        .device-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .device-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .device-card:hover {
            border-color: var(--accent-color);
            background: rgba(59, 130, 246, 0.1);
        }

        .device-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Floating Background Elements -->
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>

        <!-- Header -->
        <header style="text-align: center; margin-bottom: 2rem;">
            <h1>Device Efficiency</h1>
            <p class="subtitle">Compare speed & accuracy across inputs.</p>
        </header>

        <!-- Section 1: Device Selection -->
        <section id="selection-section" class="active-section">
            <div class="device-selector">
                <div class="device-card" onclick="selectDevice('mouse')">
                    <div class="device-icon">🖱️</div>
                    <h3>Mouse</h3>
                    <p style="font-size: 0.9rem; color: var(--text-secondary)">Clicking & Precision</p>
                </div>
                <div class="device-card" onclick="selectDevice('keyboard')">
                    <div class="device-icon">⌨️</div>
                    <h3>Keyboard</h3>
                    <p style="font-size: 0.9rem; color: var(--text-secondary)">Typing Speed</p>
                </div>
                <div class="device-card" onclick="selectDevice('touch')">
                    <div class="device-icon">👆</div>
                    <h3>Touch</h3>
                    <p style="font-size: 0.9rem; color: var(--text-secondary)">Taps & Swipes</p>
                </div>
            </div>
            <button class="secondary-btn" onclick="window.location.href='index.html'">Back to Home</button>
        </section>

        <!-- Section 2: Active Test Area -->
        <section id="test-section" class="hidden-section">
            <div class="glass-panel">
                <h2 id="test-title">Test Name</h2>
                <p id="test-instruction" class="subtitle">Instructions go here</p>

                <div id="interaction-area" class="test-area">
                    <!-- Dynamic content injected here -->
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                    <div id="stats-display" style="font-family: monospace; color: var(--accent-color);">Time: 0.0s</div>
                    <button id="end-test-btn" class="secondary-btn"
                        style="width: auto; padding: 0.5rem 1.5rem; display: none;">End Test</button>
                </div>
            </div>
        </section>

        <!-- Section 3: Results -->
        <section id="results-section" class="hidden-section">
            <div class="glass-panel">
                <h2>Test Complete</h2>
                <div class="results-grid">
                    <div class="result-card">
                        <h3>Time Taken</h3>
                        <div class="score-display">
                            <span id="result-time">0</span>
                            <span class="unit">s</span>
                        </div>
                    </div>
                    <div class="result-card">
                        <h3>Accuracy</h3>
                        <div class="score-display">
                            <span id="result-accuracy">100</span>
                            <span class="unit">%</span>
                        </div>
                    </div>
                </div>
                <button class="primary-btn" onclick="resetTest()">Test Another Device</button>
            </div>
        </section>

    </div>

    <script src="efficiency.js"></script>
</body>

</html>
